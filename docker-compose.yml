services:
  db:
    image: postgres:16
    container_name: bacons-law-db
    environment:
      POSTGRES_USER: bacon
      POSTGRES_PASSWORD: bacon
      POSTGRES_DB: bacons_law
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bacon -d bacons_law"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
